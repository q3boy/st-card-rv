随身物品:
  约定: 个人物品，以持有人+物品名为键；NPC离开不自动删除其物品
  新增: 填写所有字段
  字段:
    持有人: 玩家用“{{user}}”，NPC用姓名，沿用原行姓名，不因昵称另建行
    物品名: 简短文本，不可包含空格
    数量: 按该项单位计，可为小数
    说明: 用途、规格、特征
    状态: 完好、损坏、电量、开封等，结合实际使用更新，消耗未写数量时合理估计
  转交: 原持有人扣数量，接收人同名物品新增或增加；全部转交则移除原行。借用、代拿不改变归属
  公共与个人转移: 转入公共储备时，本表扣减，房车物资新增或增加；反向转移同理，同批只计一处
  消耗或移除: 消耗、丢失、丢弃按结果扣减或移除
