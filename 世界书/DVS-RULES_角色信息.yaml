角色信息:
  约定: 仅记录NPC，以姓名为键；角色离开仍保留记录，更新位置与同行状态
  新增: 根据正文末尾的<npc_实际姓名>人设新增，无此标签的角色不记录，原样复制标签中内容，并追加本轮互动结果；有缺失信息可用提供的历史人设补全。填写姓名、整数年龄、整数好感度；昵称有则填写
  删除: 此表数据禁止删除
  字段:
    "生活背景|相貌|身材|核心特质|行为模式|在意与反感|说话风格": 稳定人设，随剧情补充或改变
    "身份|当前处境|穿着|当前位置|状态": 正文结束时的实际情况
    # 60字内，以下7项NSFW相关字段，如某项已有信息有大量冗余、堆叠旧记录或超过60字符，总结压缩后更新
    胸部特征: 描述大小、形状、乳晕颜色、乳头状态等，不使用罩杯，如"一手盈握，水滴形，乳晕浅褐"；如无特殊情况（如乳房纹身、隆胸或二次发育等）不必更新
    私处外观: 描述阴毛分布、大小阴唇形状颜色；如无特殊情况（如剃毛、私处纹身、破处导致外观明显变化等）不必更新
    私处内部构造: 描述阴道紧致度、内壁肉壁结构、宫颈口位置深浅等；如无特殊情况（如破处，处女膜修补等）不必更新
    性经验: 如实描述既往性经历，如"母胎单身"或"有过三个前男友，经验丰富"；更新时，不必堆叠性经历，总结并记录最新状态
    性爱插入体验: 描述阴茎进入时的具体阻力、肉壁包裹感、摩擦体验及体液分泌情况等；破处后可更新，其它仅特殊情况导致插入体验发生明显变化时更新
    性爱技巧与偏好: 描述在性爱中的主动性、喜欢的姿势、特殊癖好等；更新时，不必堆叠记录，总结并记录最新状态，觉醒新性癖或习得新技巧时更新
    性爱生理反应: 描述敏感带、高潮时的身体和语言反应等；破处、熟练性爱或开发出新的生理反应后可更新
    同行状态: 同行/未加入/已离开
    相遇情境: 与主角最初相遇的经过，同行后不再更新
    对主角观感: 当前对{{user}}的看法，根据互动更新，已离开角色不必更新
    心声: 根据剧情合理推测角色本回合内心活动，已离开角色不必更新
    好感度: -100～100整数；初见按人设、观感和互动估计，不可低于50
  好感度更新:
    依据: 是否符合角色在意与反感、主角的具体行为及其对角色的影响，结合观感与心声判断；性接触不自动加分
    幅度参考: 轻微愉快或不快±1～3，实质帮助、冲突或失望±4～10，重大恩情、伤害或背叛±11～30；极端事件可更大。没有态度变化则不调整，同一事件不重复累计
    计算: 只使用delta更新，多次好感度变更输出多条delta记录
