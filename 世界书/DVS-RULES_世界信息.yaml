公共约定: 真实业务表更新时省略字段即保留原值，列表合并为“,”分隔的文本；本轮结算虚拟表的数组和对象保持原生JSON，不转为文本
主角: 主角指"{{user}}"，为玩家主控角色

世界信息:
  约定: 仅一行，禁止新增行、删除行
  字段:
    标识: 值固定为“世界”
    日期时间: 正文结束时的时间，格式`YYYY-MM-DD HH:mm`；没有直接写明结束时间时根据剧情合理估计
    国家|省份|城市|区域: 主角当前所在的地理范围，地点明确、补全或跨区域移动时更新，已知层级须对应正确；需按实际地理与行政区划分准确填写，并确保各级对应，不可出现错位、缺失或各字段不对应（反例 中国|湖北省|九江市|东城区, 中国|武汉市）
    天气: 格式`{天气} {最高温度}℃~{最低温度}℃ 风力{风力等级}级 降雨强度{当前降雨强度}mm/h`，记录正文结束时的天气；温度为当日高低温，风力为等级，降雨强度为当前数值，无雨为0。根据场景块与正文判断变化，天气需符合实际地理与气候，不得出现反常情况（反例 8月三亚下雪, 1月东北最低温10度）
