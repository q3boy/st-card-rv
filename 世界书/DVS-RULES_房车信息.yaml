房车信息:
  约定: 仅一行，禁止新增行、删除行
  字段:
    标识: 值固定为“房车”
    油料: 主副柴油箱合计，单位L，只读
    储备电力: 单位kWh，容量72，只读
    储备水源: 清水箱水量，单位L，容量1000，只读
    状态: 车况的综合描述，包括引擎、停驶、充电连接，以及左拓、右拓、后拓与升顶的具体开合情况
    行车状态: 只能写“行车”或“驻车”，表示正文结束时房车是否在移动；停车休息、停放、主角外出游览均为驻车
    拓展状态: 只能写“收起”或“展开”；左拓、右拓、后拓与升顶全部收起为收起，任一机构展开即为展开；行车状态为行车时必须为收起，具体开合写入状态
    所在地点: 当前停放或行驶的具体位置；主角外出不改变房车所在地

本轮结算:
  约定:
    无业务主键，keys使用空对象；不继承上一轮输入
    准备补给或仅连接设备不算已完成补给；补给在活动中途发生时，将活动拆在补给前后
    新增：本轮有活动、补给、额外消耗或持续补充时，通过add建立一行，value按需包含行程数组和持续补充对象；随后可replace相应字段。未发生的字段和项目省略，不填写无意义的零值
    单位：时间为分钟，距离为公里，油、水为升，电为kWh，降雨强度为mm/h；数量为非负数，允许小数，FULL表示补满

  数据结构: |
    {
      行程?: (
        // 按事件发生顺序排列，类型为行车、驻车、外出、补给或额外消耗
        // 行车/驻车/外出时长互不重复，覆盖本轮经过时间（含略过的睡眠、等候）；依据场景块与正文合理估计
        {类型:'行车', 起点:string, 终点:string, 道路类型：'铺装' | '非铺装', 距离:number, 时间:number} | //混合路面分段记录
        {类型:'驻车', 地点:string, 时间:number} | //房车停放，主要在车上生活、休息或在车旁活动
        {类型:'外出', 地点:string, 时间:number} | //房车停放，主角在外游览、购物等，车辆保持基本待机

        //【来源】使用简短文本描述
        {类型:'补给', 来源:string, 数量:number | 'FULL', 资源: '油' | '电' | '水'} | //补给，包括加油、充电、补水

        //油料、储备电力、储备水源中涉及的额外用量，如洗车、大量外放电、从油箱抽油等
        //日常开销不计入；使用外部资源如营地外接水电不计入
        //正文未明确提及数量时根据行为合理估计；
        {类型:'额外消耗', 行为:string, 数量:number, 资源: '油' | '电' | '水'}
      )[],

      // 太阳能和雨水收集自动持续，不记录开启、停止状态
      持续补充?: {
        太阳能时长?:number, // 根据本轮时间、日照、天气和遮挡估计有效工作时长，夜间不计，室内或又遮蔽停车不计
        风电时长?:number, // 根据正文中风机部署使用情况和风力估计工作时长
        雨水收集?:{时长:number, 平均降雨强度:number} // 根据本轮降雨填写；正文结束时雨停不抹掉本轮已有降雨
      }
    }
