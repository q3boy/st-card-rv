房车物资:
  约定: 额外公共物资，以物品名为键；不含固定设备及车载油、电、清水
  新增: 填写物品名、非负整数数量、单位；单位使用桶、袋、盒、包、份、件等计数单位，同名采购并入原行
  字段:
    数量: 按该项单位计，为非负整数；尚未用尽的开封包装仍计1份
    单位: 桶、袋、盒、包、份、件等计数单位, 新建后不更新
    说明: 规格、用途等；部分取用后的剩余情况按正文用文字描述，不换算小数数量
    状态: 新鲜、冷冻、开封、损坏等，描述整体状态，不在此处标记单件状态
    存放位置: 正文未直接描述请根据房车结构合理推断收纳处
  数量更新: 仅用尽一份、丢弃或转交整份时扣减对应整数数量；部分取用时不扣数量，开封或搬位置本身不扣数量
  用尽或移除: 用尽但保留容器时数量记0；整批不再保留时移除
  归属变化: 整份转为个人所有时，本表扣减，随身物品新增或增加，同批只计一处；临时取用不改变归属
