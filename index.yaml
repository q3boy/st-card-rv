扩展字段:
  正则:
    - 正则名称: 新增npc隐藏
      启用: true
      id: 01a1463f-0fc3-720c-8043-bce63e5ac5ba
      查找表达式: /<npc_([^>\s]+)>([\s\S]*?)<\/npc_\1>/ig
      内容: <blockquote>新增NPC：$1</blockquote>
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false
    - 正则名称: 新增npc中
      启用: true
      id: 01a147d9-9183-74b5-a934-ddbebfde9a30
      查找表达式: /<npc_([^>\s]+)>(?![\s\S]*?<\/npc_\1>)[\s\S]*/ig
      内容: <blockquote>新增NPC：$1 {{random::⠋::⠙::⠹::⠸::⠼::⠴::⠦::⠧::⠇::⠏}}</blockquote>
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false
      最大深度: 1
    - 正则名称: 场景信息
      启用: true
      id: 01a14805-0eb5-7be6-beb3-57911b198eee
      查找表达式: /<scene_info>\s*([\s\S]*?)\s*<\/scene_info>/ig
      内容: |
        ---
        <blockquote style="white-space: pre-line">$1</blockquote>
        ---
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

  酒馆助手:
    脚本库:
      - 名称: 酒馆sqlite助手安装引导
        id: 01a15a6c-8e86-70c4-9fce-c9729b904c2b
        启用: true
        类型: 脚本
        文件: 脚本/install.js
        数据: {}
        按钮:
          启用: false
          按钮列表: []

      - 名称: 世界书版本检查
        id: 01a158de-0b37-718e-a539-66ad1df3b74d
        启用: true
        类型: 脚本
        文件: 脚本\主世界书版本检查.js
        按钮:
          启用: false
          按钮列表: []

      - 名称: DVS
        id: 01a12d2e-a1d6-7327-beca-ca78ff193583
        启用: true
        类型: 脚本
        文件: 脚本\DVS.js
        数据:
          dvs_enable: true
          dvs_input_inject: true
          dvs_plot: true
        按钮:
          启用: false
          按钮列表: []

      - 名称: 状态栏
        id: 01a13963-abf0-7be3-9566-aff4c1865e76
        启用: true
        类型: 脚本
        文件: 脚本\状态栏.js
        按钮:
          启用: false
          按钮列表: []

    变量: {}

  cm_manager:
    tags:
      - DSV
      - 都市
      - 后宫
      - 旅行
      - NTL
    summary: |
      2026年中国现实映射背景，性观念开放，一男多女关系受到广泛认同。
      主角{{user}}为千万粉职业旅行博主，财富自由，驾驶定制越野房车旅行。
      以房车旅途为框架，按行驶、停靠、露营、景点等情境生成女性NPC，均有发展感情潜力，涵盖粉丝追随、穷游搭车等模板，可触发倒贴。
      开场于2026年6月5日周五上午，主角在家旁边的停车场完成物资和车况检查，收起拓展舱与升顶、收好充电线，坐进驾驶室考虑第一站；
      省市、目的地和后续故事由玩家决定，开场没有NPC登场。NPC首次登场后附详细人设卡。
