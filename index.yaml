备注: |-
  必备插件：
    1. [酒馆助手](https://github.com/n0vi028/JS-Slash-Runner)
    2. [Sqlite-Helper](https://github.com/q3boy/st-sqlite-helper)
  Sqlite-Helper 设置中确保 启用 SQLite 服务，存储模式建议选择 【游玩模式】
  首次游玩请在开场白中设置 DVS 相关模型参数（建议deepseek-flash, 并使用json_object模式，温度0.8）
  如需使用地图模块增强沉浸感请参照状态栏内使用说明绑定高德 api key和 secret key
